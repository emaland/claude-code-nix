name: Test Pull Request

on:
  pull_request:
    paths:
      - 'package.nix'
      - 'flake.nix'
      - 'flake.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Build
        run: |
          echo "Building claude-code (native)..."
          nix build .#claude-code -o result-native --print-build-logs

      - name: Test claude versions
        run: |
          echo "Testing claude-code (native)..."
          ./result-native/bin/claude --version

      - name: Verify package contents
        run: |
          echo "Verifying claude-code (native)..."
          test -f ./result-native/bin/claude
          test -f ./result-native/bin/.claude-unwrapped

      - name: Run basic functionality test
        run: |
          echo "Testing claude-code (native)..."
          ./result-native/bin/claude --help || true
          ./result-native/bin/claude --version 2>&1 | grep -E "claude-code|Claude"
